        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        /* Header Styles */
        .header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text);
            text-decoration: none;
        }

        .nav-controls nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .nav-controls a {
            text-decoration: none;
            color: var(--text);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .badge-new {
            background-color: #ef4444;
            color: white;
            font-size: 0.7rem;
            padding: 0.15rem 0.4rem;
            border-radius: 9999px;
            font-weight: bold;
            vertical-align: super;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropbtn {
            background: none;
            border: none;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--card-bg);
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.1);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            z-index: 1;
            right: 0;
        }

        .dropdown-content a {
            color: var(--text);
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: var(--bg);
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .lang-select {
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            border: 1px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-weight: 600;
        }

        /* Container & Layout */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .hero {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .hero h1 {
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Calculators Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, min-min(280px, 1fr));
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.75rem;
        }

        .card-icon-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .icon {
            font-size: 1.5rem;
        }

        .card-title {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 600;
        }

        .badge-top { background-color: #fee2e2; color: #dc2626; }
        .badge-nuevo { background-color: #fef3c7; color: #d97706; }
        .badge-autonomo { background-color: #e0e7ff; color: #4338ca; }

        .card-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            flex-grow: 1;
            margin-bottom: 1.25rem;
        }

        .btn-calc {
            background-color: var(--bg);
            color: var(--primary);
            border: 1px solid var(--border);
            padding: 0.6rem 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-calc:hover {
            background-color: var(--primary);
            color: white;
        }

        /* Modal / Active Calculator View */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 200;
            overflow-y: auto;
            padding: 2rem 1rem;
        }

        .modal-content {
            background: var(--card-bg);
            max-width: 800px;
            margin: 0 auto;
            border-radius: 0.75rem;
            padding: 2rem;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            cursor: pointer;
            background: none;
            border: none;
        }

        /* IVA Calculator Specific UI */
        .tabs {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .tab {
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            font-weight: 500;
        }

        .tab.active {
            border-color: var(--primary);
            color: var(--primary);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 1rem;
        }

        .rate-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .rate-btn {
            flex: 1;
            padding: 0.5rem;
            border: 1px solid var(--border);
            background: var(--bg);
            border-radius: 0.375rem;
            cursor: pointer;
            text-align: center;
        }

        .rate-btn.active {
            border-color: var(--primary);
            background-color: #eff6ff;
            color: var(--primary);
        }

        .result-box {
            background-color: #f1f5f9;
            padding: 1rem;
            border-radius: 0.5rem;
            margin-top: 1rem;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .result-row.total {
            font-weight: bold;
            font-size: 1.2rem;
            border-top: 1px solid var(--border);
            padding-top: 0.5rem;
        }

        /* SEO Content & Tables inside Modal */
        .info-section {
            margin-top: 2rem;
            border-top: 1px solid var(--border);
            padding-top: 1.5rem;
        }

        .info-section h3 {
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 0.5rem;
            text-align: left;
        }

        th {
            background-color: var(--bg);
        }

            </div>
            <p class="card-desc">${desc}</p>
            <button class="btn-calc" onclick="openCalculator('${calc.id}')">${translations[currentLang].use_calc}</button>
        `;
        grid.appendChild(card);
    });
}

function changeLanguage(lang) {
    currentLang = lang;
    document.querySelectorAll('[data-key]').forEach(el => {
        const key = el.getAttribute('data-key');
        if (translations[lang][key]) {
            el.textContent = translations[lang][key];
        }
    });
    renderGrid();
}

// Modal open logic
function openCalculator(id) {
    const modal = document.getElementById('calcModal');
    const modalBody = document.getElementById('modalBody');
    
    if (id === 'iva') {
        modalBody.innerHTML = getIVACalculatorHTML();
        initIVACalculator();
    } else {
        modalBody.innerHTML = `<h2>${translations[currentLang][`c_${id}_title`]}</h2><p style="margin-top:1rem;">Tool dynamic UI component ready.</p>`;
    }
    
    modal.style.display = 'block';
}

function closeModal() {
    document.getElementById('calcModal').style.display = 'none';
}

// Full 100% Functional IVA Calculator Implementation
let selectedIvaRate = 21;
let currentIvaMode = 'add';

function getIVACalculatorHTML() {
    return `
        <h2>Calculadora de IVA Online Gratis 2026</h2>
        <p style="color:var(--text-muted); margin-bottom: 1rem;">Añade o quita el IVA al 21%, 10% y 4% al instante.</p>
        
        <div class="tabs">
            <div class="tab active" onclick="setIvaMode('add', this)">➕ Añadir IVA</div>
            <div class="tab" onclick="setIvaMode('remove', this)">➖ Quitar IVA (inverso)</div>
        </div>

        <div class="form-group">
            <label id="priceLabel">Precio sin IVA (€)</label>
            <input type="number" id="ivaAmount" placeholder="100" value="100" oninput="calculateIVA()">
        </div>

        <div class="form-group">
            <label>Tipo de IVA</label>
            <div class="rate-buttons">
                <button class="rate-btn active" onclick="setIvaRate(21, this)">21%<br><small>General</small></button>
                <button class="rate-btn" onclick="setIvaRate(10, this)">10%<br><small>Reducido</small></button>
                <button class="rate-btn" onclick="setIvaRate(4, this)">4%<br><small>Superreducido</small></button>
            </div>
        </div>

        <div class="result-box">
            <div class="result-row">
                <span>Base Imponible:</span>
                <span id="resBase">100.00 €</span>
            </div>
            <div class="result-row">
                <span>Cuota IVA (<span id="resRateText">21</span>%):</span>
                <span id="resCuota">21.00 €</span>
            </div>
            <div class="result-row total">
                <span>Total:</span>
                <span id="resTotal">121.00 €</span>
            </div>
        </div>

        <div class="info-section">
            <h3>Tabla de referencia rápida</h3>
            <table>
                <thead>
                    <tr>
                        <th>Base imponible</th>
                        <th>IVA 21% → Total</th>
                        <th>IVA 10% → Total</th>
                        <th>IVA 4% → Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td>10,00 €</td><td>12,10 €</td><td>11,00 €</td><td>10,40 €</td></tr>
                    <tr><td>50,00 €</td><td>60,50 €</td><td>55,00 €</td><td>52,00 €</td></tr>
                    <tr><td>100,00 €</td><td>121,00 €</td><td>110,00 €</td><td>104,00 €</td></tr>
                    <tr><td>1000,00 €</td><td>1210,00 €</td><td>1100,00 €</td><td>1040,00 €</td></tr>
                </tbody>
            </table>
        </div>
    `;
}

function setIvaMode(mode, el) {
    currentIvaMode = mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('priceLabel').textContent = mode === 'add' ? 'Precio sin IVA (€)' : 'Precio con IVA (€)';
    calculateIVA();
}

function setIvaRate(rate, el) {
    selectedIvaRate = rate;
    document.querySelectorAll('.rate-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    calculateIVA();
}

function initIVACalculator() {
    calculateIVA();
}

function calculateIVA() {
    const val = parseFloat(document.getElementById('ivaAmount').value) || 0;
    let base = 0;
    let cuota = 0;
    let total = 0;

    if (currentIvaMode === 'add') {
        base = val;
        cuota = base * (selectedIvaRate / 100);
        total = base + cuota;
    } else {
        total = val;
        base = total / (1 + selectedIvaRate / 100);
        cuota = total - base;
    }

    document.getElementById('resBase').textContent = base.toFixed(2) + ' €';
    document.getElementById('resCuota').textContent = cuota.toFixed(2) + ' €';
    document.getElementById('resTotal').textContent = total.toFixed(2) + ' €';
    document.getElementById('resRateText').textContent = selectedIvaRate;
}

// Close modal when clicking outside
window.onclick = function(event) {
    const modal = document.getElementById('calcModal');
    if (event.target === modal) {
        closeModal();
    }
}

// Initial render
renderGrid();
</script>
</body>

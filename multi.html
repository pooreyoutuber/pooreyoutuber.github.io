<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Video Converter Tool</title>
    <!-- Modern UI Styling (Tailwind CSS CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header / Logo -->
    <div class="text-center mb-8">
        <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
            <i class="fa-solid fa-file-video mr-2"></i> Fast Video Converter
        </h1>
        <p class="text-slate-400 mt-2">Apni kisi bhi video ko aasani se convert karein (100% Secure & Client-side)</p>
    </div>

    <!-- Main Card Container -->
    <div class="w-full max-w-2xl bg-slate-800 rounded-2xl shadow-2xl p-6 border border-slate-700">
        
        <!-- Step 1: File Selection -->
        <div class="mb-6">
            <label class="block text-sm font-semibold text-slate-300 mb-2">1. Video Select Karein:</label>
            <div id="drop-zone" class="border-2 border-dashed border-slate-600 rounded-xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer bg-slate-800/50">
                <input type="file" id="video-input" accept="video/*" class="hidden">
                <i class="fa-solid fa-cloud-arrow-up text-4xl text-blue-400 mb-3"></i>
                <p class="text-lg font-medium text-slate-200">Video yahan Drop karein ya Click karke Chunein</p>
                <p class="text-xs text-slate-400 mt-1">MP4, AVI, MOV, MKV, WEBM aadi support hai</p>
            </div>
            
            <!-- Selected File Info -->
            <div id="file-info" class="hidden mt-3 p-3 bg-slate-700/50 rounded-lg flex items-center justify-between">
                <div class="flex items-center space-x-3 overflow-hidden">
                    <i class="fa-solid fa-file-video text-2xl text-blue-400"></i>
                    <div class="truncate">
                        <p id="file-name" class="font-medium text-sm text-slate-200 truncate"></p>
                        <p id="file-size" class="text-xs text-slate-400"></p>
                    </div>
                </div>
                <button id="remove-file" class="text-slate-400 hover:text-red-400 transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
        </div>

        <!-- Step 2: Format & Quality Settings -->
        <div class="mb-6 grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label for="format-select" class="block text-sm font-semibold text-slate-300 mb-2">2. Format Format Chunein:</label>
                <select id="format-select" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2.5 text-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="mp4" selected>MP4 (Most Common)</option>
                    <option value="webm">WEBM (Web Optimized)</option>
                    <option value="avi">AVI</option>
                    <option value="mkv">MKV</option>
                    <option value="mov">MOV (QuickTime)</option>
                    <option value="gif">Animated GIF</option>
                    <option value="mp3">Audio Only (MP3)</option>
                </select>
            </div>
            <div>
                <label for="resolution-select" class="block text-sm font-semibold text-slate-300 mb-2">3. Resolution / Quality:</label>
                <select id="resolution-select" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2.5 text-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="same" selected>Same as Source (Original)</option>
                    <option value="1080">1080p (Full HD)</option>
                    <option value="720">720p (HD)</option>
                    <option value="480">480p (SD)</option>
                    <option value="360">360p (Low Quality)</option>
                </select>
            </div>
        </div>

        <!-- Conversion Progress -->
        <div id="progress-container" class="hidden mb-6">
            <div class="flex justify-between text-sm text-slate-300 mb-1">
                <span id="status-text">Processing video...</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden">
                <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Step 3: Convert Action Button -->
        <button id="convert-btn" disabled class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold py-3 px-6 rounded-xl transition-all shadow-lg flex items-center justify-center space-x-2">
            <i class="fa-solid fa-gear"></i>
            <span>Convert Video Now</span>
        </button>

        <!-- Result / Download Area -->
        <div id="result-container" class="hidden mt-6 p-4 bg-slate-700/30 border border-emerald-500/30 rounded-xl text-center">
            <p class="text-emerald-400 font-semibold mb-3">
                <i class="fa-solid fa-circle-check mr-1"></i> Conversion Complete!
            </p>
            <a id="download-btn" href="#" download="" class="inline-flex items-center space-x-2 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2.5 px-6 rounded-lg transition-colors">
                <i class="fa-solid fa-download"></i>
                <span>Download Converted File</span>
            </a>
        </div>

    </div>

    <!-- FFmpeg WASM Library CDN -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
    
    <script>
        const { createFFmpeg, fetchFile } = FFmpeg;
        
        // Initialize FFmpeg instance
        const ffmpeg = createFFmpeg({
            log: true,
            corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
        });

        // DOM Elements
        const dropZone = document.getElementById('drop-zone');
        const videoInput = document.getElementById('video-input');
        const fileInfo = document.getElementById('file-info');
        const fileNameDisplay = document.getElementById('file-name');
        const fileSizeDisplay = document.getElementById('file-size');
        const removeFileBtn = document.getElementById('remove-file');
        const convertBtn = document.getElementById('convert-btn');
        const formatSelect = document.getElementById('format-select');
        const resolutionSelect = document.getElementById('resolution-select');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');
        const progressPercent = document.getElementById('progress-percent');
        const statusText = document.getElementById('status-text');
        const resultContainer = document.getElementById('result-container');
        const downloadBtn = document.getElementById('download-btn');

        let selectedFile = null;

        // Click to upload
        dropZone.addEventListener('click', () => videoInput.click());

        // File Selection Handler
        videoInput.addEventListener('change', (e) => handleFileSelect(e.target.files[0]));

        // Drag & Drop Handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-blue-500', 'bg-slate-700/50');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-blue-500', 'bg-slate-700/50');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-slate-700/50');
            if (e.dataTransfer.files.length > 0) {
                handleFileSelect(e.dataTransfer.files[0]);
            }
        });

        function handleFileSelect(file) {
            if (!file) return;
            selectedFile = file;
            fileNameDisplay.textContent = file.name;
            fileSizeDisplay.textContent = (file.size / (1024 * 1024)).toFixed(2) + " MB";
            
            dropZone.classList.add('hidden');
            fileInfo.classList.remove('hidden');
            convertBtn.disabled = false;
            resultContainer.classList.add('hidden');
        }

        // Remove File Handler
        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            videoInput.value = '';
            dropZone.classList.remove('hidden');
            fileInfo.classList.add('hidden');
            convertBtn.disabled = true;
            resultContainer.classList.add('hidden');
            progressContainer.classList.add('hidden');
        });

        // Convert Button Event Listener
        convertBtn.addEventListener('click', async () => {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            resultContainer.classList.add('hidden');
            progressContainer.classList.remove('hidden');
            statusText.textContent = "Loading Engine (Pehli baar thoda samay le sakta hai)...";
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';

            try {
                // Load FFmpeg core WASM if not loaded
                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }

                statusText.textContent = "Processing File...";

                // Set progress callback
                ffmpeg.setProgress(({ ratio }) => {
                    const percent = Math.round(ratio * 100);
                    if (percent >= 0 && percent <= 100) {
                        progressBar.style.width = `${percent}%`;
                        progressPercent.textContent = `${percent}%`;
                    }
                });

                const inputExt = selectedFile.name.split('.').pop();
                const outputExt = formatSelect.value;
                const inputName = `input.${inputExt}`;
                const outputName = `output.${outputExt}`;

                // Write file to FFmpeg WASM Memory
                ffmpeg.FS('writeFile', inputName, await fetchFile(selectedFile));

                // FFmpeg command arguments
                let ffmpegArgs = ['-i', inputName];

                // Resolution settings
                const res = resolutionSelect.value;
                if (res !== 'same' && outputExt !== 'mp3') {
                    if (res === '1080') ffmpegArgs.push('-vf', 'scale=-2:1080');
                    else if (res === '720') ffmpegArgs.push('-vf', 'scale=-2:720');
                    else if (res === '480') ffmpegArgs.push('-vf', 'scale=-2:480');
                    else if (res === '360') ffmpegArgs.push('-vf', 'scale=-2:360');
                }

                // Audio Only extraction setting
                if (outputExt === 'mp3') {
                    ffmpegArgs.push('-vn', '-ab', '192k');
                }

                ffmpegArgs.push(outputName);

                // Run FFmpeg Command
                await ffmpeg.run(...ffmpegArgs);

                // Read output file
                const data = ffmpeg.FS('readFile', outputName);

                // Create Blob and Download URL
                const mimeType = outputExt === 'mp3' ? 'audio/mp3' : `video/${outputExt}`;
                const blob = new Blob([data.buffer], { type: mimeType });
                const url = URL.createObjectURL(blob);

                downloadBtn.href = url;
                downloadBtn.download = `converted_${Date.now()}.${outputExt}`;
                
                statusText.textContent = "Done!";
                resultContainer.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                alert('Conversion mein kuch errror aayi: ' + err.message);
                statusText.textContent = "Conversion Failed!";
            } finally {
                convertBtn.disabled = false;
            }
        });
    </script>
</body>
</html>

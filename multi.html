<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe & Watch</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #f5f5f5;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Subscribe to Watch Video</h2>
    <p>Please subscribe to our channel first.</p>

    <button onclick="subscribe()">
        Subscribe
    </button>

    <br><br>

    <button onclick="watchVideo()">
        Watch Video
    </button>
</div>

<script>
function subscribe() {
    window.location.href =
        "https://www.youtube.com/@user-ds77?sub_confirmation=1";
}

function watchVideo() {
    window.location.href =
        "https://www.youtube.com/shorts/99p9xqVMcaw";
}
</script>

</body>
</html>

        .faq-UI को blue से white (Light Mode) करने का तरीका इस बात पर निर्भर करता है कि आप किस Tool की बात कर रहे हैं। 

सामान्यतः इसे बदलने के लिए ये तरीके काम करते हैं:

1. **Settings (⚙️ Icon) में जाएँ:**
   * Tool के अंदर **Settings** या **Preferences** पर क्लिक करें।
   * **Appearance**, **Theme**, या **Display** वाले ऑप्शन पर जाएँ।
   * वहाँ **Dark/Blue** की जगह **Light** या **White** select करें।

2. **अगर आप Developer हैं और खुद का Tool/UI बना रहे हैं (CSS):**
   * CSS में `background-color` बदलकर white कर दें:
     ```css
     body {
         background-color: #ffffff; /* White background */
         color: #000000; /* Dark text */
     }
     ```

3. **अगर Browser Extension या Web Tool है:**
   * Browser के Extension Settings में या Top-Right Corner पर Profile/Theme switcher चेक करें।

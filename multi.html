<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODJR — Frontline Combat (Step 1)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: Arial, Helvetica, sans-serif; user-select: none; }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.78); color: #fff; text-align: center; z-index: 10; padding: 20px; box-sizing: border-box; }
  .overlay h1 { font-size: 56px; margin: 0; letter-spacing: 4px; color: #e8c26a; }
  .overlay h2 { font-size: 20px; margin: 6px 0 16px; letter-spacing: 2px; color: #ddd; font-weight: normal; }
  .overlay p { font-size: 17px; max-width: 640px; line-height: 1.5; margin: 6px 0; }
  .overlay button { background: #e8c26a; color: #111; border: 0; padding: 14px 44px; font-size: 20px; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 18px; }
  .overlay button:hover { background: #ffd98a; }
  .overlay button:disabled { background: #555; color: #aaa; cursor: not-allowed; }
  #deathScreen { pointer-events: none; background: rgba(120,0,0,0.55); }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 0 4px #000; z-index: 5; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 20px; height: 20px; transform: translate(-50%, -50%); }
  #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #fff; box-shadow: 0 0 2px #000; }
  #crosshair::before { left: 9px; top: 0; width: 2px; height: 20px; }
  #crosshair::after { top: 9px; left: 0; width: 20px; height: 2px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 22px; height: 22px; transform: translate(-50%, -50%) rotate(45deg); border: 3px solid #ff3b3b; opacity: 0; box-sizing: border-box; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,0,0,0) 45%, rgba(255,0,0,0.9) 100%); opacity: 0; }
  #kd { position: absolute; top: 14px; left: 14px; font-size: 22px; font-weight: bold; }
  #enemies { position: absolute; top: 44px; left: 14px; font-size: 14px; color: #ffd98a; }
  #feed { position: absolute; top: 14px; right: 14px; text-align: right; font-size: 15px; }
  #feed div { margin-bottom: 4px; }
  #msg { position: absolute; top: 30%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: bold; letter-spacing: 2px; color: #ffd98a; opacity: 0; }
  #health { position: absolute; bottom: 20px; left: 20px; font-size: 30px; font-weight: bold; }
  #ammo { position: absolute; bottom: 20px; right: 20px; font-size: 30px; font-weight: bold; }
  #ammo small { font-size: 16px; color: #ffd98a; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="game"></div>

<div id="hud" class="hidden">
  <div id="kd">K 0 &nbsp; D 0</div>
  <div id="enemies"></div>
  <div id="feed"></div>
  <div id="msg"></div>
  <div id="crosshair"></div>
  <div id="hitmarker"></div>
  <div id="vignette"></div>
  <div id="health">HP 100</div>
  <div id="ammo">30 / 120</div>
</div>

<div id="startScreen" class="overlay">
  <h1>CODJR</h1>
  <h2>FRONTLINE COMBAT — STEP 1</h2>
  <p>Map: <b>OUTPOST</b> &nbsp;|&nbsp; 3 bots: New, Pro, Ultra</p>
  <p>WASD: move &nbsp;·&nbsp; Mouse: look &nbsp;·&nbsp; Left click: fire &nbsp;·&nbsp; Shift: sprint &nbsp;·&nbsp; Space: jump &nbsp;·&nbsp; R: reload &nbsp;·&nbsp; Esc: pause</p>
  <button id="startBtn">START MATCH</button>
  <p id="loadStatus"></p>
</div>

<div id="pauseScreen" class="overlay hidden">
  <h1>PAUSED</h1>
  <p>Click karke wapas khelein (mouse capture hoga)</p>
</div>

<div id="deathScreen" class="overlay hidden">
  <h1>YOU DIED</h1>
  <p id="respawnText"></p>
</div>

<script>
(function () {
  'use strict';

  const $ = id => document.getElementById(id);
  const loadStatus = $('loadStatus');

  // ---------- Startup checks ----------
  if (typeof THREE === 'undefined') {
    loadStatus.textContent = 'ERROR: Three.js load nahi hua. Internet connection check karein aur page reload karein.';
    $('startBtn').disabled = true;
    return;
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    loadStatus.textContent = 'ERROR: Is browser mein WebGL available nahi hai.';
    $('startBtn').disabled = true;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  $('game').appendChild(renderer.domElement);

  // ---------- Config & helpers ----------
  const CFG = {
    EYE: 1.6, R: 0.4, GRAV: -22, JUMP: 7.5, WALK: 5.5, SPRINT: 8.5,
    MAG: 30, RES: 120, RELOAD: 1.8, FIRE: 0.1, PDMG: 25, HEADX: 2,
    BDMG: 12, BOUND: 38, PRESP: 3, BRESP: 4, SENS: 0.0022
  };
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---------- Scene ----------
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xd9c49a);
  scene.fog = new THREE.Fog(0xd9c49a, 55, 130);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 300);
  camera.rotation.order = 'YXZ';
  scene.add(camera);

  scene.add(new THREE.HemisphereLight(0xfff3dc, 0x7a6040, 0.9));
  const sun = new THREE.DirectionalLight(0xfff0d0, 1.1);
  sun.position.set(-30, 50, 20);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -45; sun.shadow.camera.right = 45;
  sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -45;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 150;
  sun.shadow.camera.updateProjectionMatrix();
  scene.add(sun);
  scene.add(sun.target);

  // Ground
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(80, 80),
    new THREE.MeshLambertMaterial({ color: 0xc9a66b })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  for (let i = 0; i < 14; i++) {
    const p = new THREE.Mesh(
      new THREE.CircleGeometry(rnd(3, 7), 16),
      new THREE.MeshLambertMaterial({ color: 0xb8925a })
    );
    p.rotation.x = -Math.PI / 2;
    p.position.set(rnd(-34, 34), 0.01, rnd(-34, 34));
    p.receiveShadow = true;
    scene.add(p);
  }

  // ---------- Map: OUTPOST ----------
  // Each obstacle is a box: x, z center; w (x size), d (z size), h (height), c (color)
  const OBST = [
    // Perimeter walls
    { x: 0, z: -40, w: 80, d: 1, h: 4, c: 0xb08d57 },
    { x: 0, z: 40, w: 80, d: 1, h: 4, c: 0xb08d57 },
    { x: -40, z: 0, w: 1, d: 80, h: 4, c: 0xb08d57 },
    { x: 40, z: 0, w: 1, d: 80, h: 4, c: 0xb08d57 },
    // Main buildings
    { x: -16, z: -14, w: 12, d: 8, h: 5, c: 0xe0c8a0 },
    { x: 16, z: 14, w: 12, d: 8, h: 5, c: 0xe0c8a0 },
    { x: 18, z: -16, w: 6, d: 6, h: 4, c: 0xd6b98a },
    { x: -18, z: 16, w: 6, d: 6, h: 4, c: 0xd6b98a },
    // Center barriers
    { x: -6, z: 0, w: 1, d: 6, h: 1.3, c: 0x9a9a92 },
    { x: 6, z: 0, w: 1, d: 6, h: 1.3, c: 0x9a9a92 },
    { x: -8, z: -28, w: 6, d: 1, h: 1.3, c: 0x9a9a92 },
    { x: 8, z: 28, w: 6, d: 1, h: 1.3, c: 0x9a9a92 },
    { x: 28, z: -6, w: 1, d: 8, h: 1.3, c: 0x9a9a92 },
    { x: -28, z: 6, w: 1, d: 8, h: 1.3, c: 0x9a9a92 },
    // Crates
    { x: -4, z: -22, w: 1.5, d: 1.5, h: 1.5, c: 0x6b4f2a },
    { x: -2.5, z: -22, w: 1.5, d: 1.5, h: 1.5, c: 0x6b4f2a },
    { x: 4, z: 22, w: 1.5, d: 1.5, h: 1.5, c: 0x6b4f2a },
    { x: 24, z: -26, w: 1.5, d: 1.5, h: 1.5, c: 0x6b4f2a },
    { x: -24, z: 26, w: 1.5, d: 1.5, h: 1.5, c: 0x6b4f2a },
    { x: 12, z: -4, w: 1.5, d: 1.5, h: 1.5, c: 0x6b4f2a },
    { x: -12, z: 4, w: 1.5, d: 1.5, h: 1.5, c: 0x6b4f2a },
    // Watchtowers
    { x: -30, z: -22, w: 3, d: 3, h: 7, c: 0x8a7a60 },
    { x: 30, z: 22, w: 3, d: 3, h: 7, c: 0x8a7a60 },
    // Mid cover
    { x: 0, z: -16, w: 4, d: 1, h: 2.5, c: 0xc0a878 }
  ];

  const colliders = [];   // AABBs used for movement collision
  const wallMeshes = [];  // meshes used for bullet / line-of-sight raycasts

  OBST.forEach(o => {
    const m = new THREE.Mesh(
      new THREE.BoxGeometry(o.w, o.h, o.d),
      new THREE.MeshLambertMaterial({ color: o.c })
    );
    m.position.set(o.x, o.h / 2, o.z);
    m.castShadow = true;
    m.receiveShadow = true;
    scene.add(m);
    wallMeshes.push(m);
    colliders.push({ minX: o.x - o.w / 2, maxX: o.x + o.w / 2, minZ: o.z - o.d / 2, maxZ: o.z + o.d / 2 });
  });

  // Push a circle (radius r) out of all colliders and keep inside bounds
  function resolve(p, r) {
    for (let i = 0; i < colliders.length; i++) {
      const c = colliders[i];
      if (p.x < c.minX - r || p.x > c.maxX + r || p.z < c.minZ - r || p.z > c.maxZ + r) continue;
      const cx = clamp(p.x, c.minX, c.maxX);
      const cz = clamp(p.z, c.minZ, c.maxZ);
      const dx = p.x - cx, dz = p.z - cz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= r * r) continue;
      if (d2 > 1e-9) {
        const d = Math.sqrt(d2), k = (r - d) / d;
        p.x += dx * k; p.z += dz * k;
      } else {
        const l = p.x - c.minX, rt = c.maxX - p.x, b = p.z - c.minZ, f = c.maxZ - p.z;
        const m = Math.min(l, rt, b, f);
        if (m === l) p.x = c.minX - r;
        else if (m === rt) p.x = c.maxX + r;
        else if (m === b) p.z = c.minZ - r;
        else p.z = c.maxZ + r;
      }
    }
    p.x = clamp(p.x, -CFG.BOUND, CFG.BOUND);
    p.z = clamp(p.z, -CFG.BOUND, CFG.BOUND);
  }

  function isFree(x, z, r) {
    if (Math.abs(x) > CFG.BOUND - 1 || Math.abs(z) > CFG.BOUND - 1) return false;
    for (const c of colliders) {
      if (x > c.minX - r && x < c.maxX + r && z > c.minZ - r && z < c.maxZ + r) return false;
    }
    return true;
  }

  // Navigation waypoints (random free points on the map)
  const WPS = [];
  for (let i = 0; i < 400 && WPS.length < 60; i++) {
    const x = rnd(-34, 34), z = rnd(-34, 34);
    if (isFree(x, z, 1.2)) WPS.push({ x, z });
  }

  const SPAWNS = [
    { x: -32, z: -32 }, { x: 32, z: 32 }, { x: 32, z: -32 }, { x: -32, z: 32 },
    { x: 0, z: -34 }, { x: 0, z: 34 }, { x: -34, z: 0 }, { x: 34, z: 0 }
  ];

  // ---------- Line of sight ----------
  const _ray = new THREE.Raycaster();
  const _o = new THREE.Vector3();
  const _d = new THREE.Vector3();
  const _tmp = new THREE.Vector3();

  function hasLOS(ox, oy, oz, tx, ty, tz) {
    _o.set(ox, oy, oz);
    _d.set(tx - ox, ty - oy, tz - oz);
    const dist = _d.length();
    _d.divideScalar(dist);
    _ray.set(_o, _d);
    _ray.far = dist;
    return _ray.intersectObjects(wallMeshes, false).length === 0;
  }

  // ---------- Effects (tracers, sparks) ----------
  const effects = [];
  const sparkGeo = new THREE.SphereGeometry(0.06, 6, 6);

  function addEffect(obj, life) {
    scene.add(obj);
    effects.push({ o: obj, t: life });
  }
  function tracer(a, b, color) {
    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
    const m = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.85 });
    addEffect(new THREE.Line(g, m), 0.06);
  }
  function spark(p, color) {
    const m = new THREE.Mesh(sparkGeo, new THREE.MeshBasicMaterial({ color: color }));
    m.position.copy(p);
    addEffect(m, 0.12);
  }
  function updateEffects(dt) {
    for (let i = effects.length - 1; i >= 0; i--) {
      const e = effects[i];
      e.t -= dt;
      if (e.t <= 0) {
        scene.remove(e.o);
        if (e.o.geometry !== sparkGeo) e.o.geometry.dispose();
        e.o.material.dispose();
        effects.splice(i, 1);
      }
    }
  }

  // ---------- Player's gun (attached to camera) ----------
  const gun = new THREE.Group();
  const gunMat = new THREE.MeshLambertMaterial({ color: 0x2b2b2b });
  const gunDark = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.6), gunMat);
  gunBody.position.set(0, 0, -0.35);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.3, 8), gunDark);
  barrel.rotation.x = Math.PI / 2;
  barrel.position.set(0, 0.02, -0.72);
  const mag = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.2, 0.1), gunDark);
  mag.position.set(0, -0.16, -0.3);
  const stock = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.25), gunMat);
  stock.position.set(0, -0.02, -0.02);
  gun.add(gunBody, barrel, mag, stock);
  gun.position.set(0.28, -0.26, 0);
  camera.add(gun);

  const _muzzle = new THREE.Vector3();
  function muzzleWorld() {
    camera.updateMatrixWorld();
    _muzzle.set(0, 0.02, -0.85);
    gun.localToWorld(_muzzle);
    return _muzzle.clone();
  }

  // ---------- Bots ----------
  const TIERS = {
    NEW:   { name: 'NEW',   color: 0x3f7fd0, reaction: 1.2, spread: 0.12, speed: 3.2, fire: 0.6,  strafeMin: 1.5, strafeMax: 3.0, pref: 16 },
    PRO:   { name: 'PRO',   color: 0xd04a3a, reaction: 0.6, spread: 0.05, speed: 4.4, fire: 0.3,  strafeMin: 0.9, strafeMax: 2.0, pref: 14 },
    ULTRA: { name: 'ULTRA', color: 0x8a3ad0, reaction: 0.3, spread: 0.03, speed: 5.0, fire: 0.22, strafeMin: 0.6, strafeMax: 1.4, pref: 12 }
  };

  function makeBotModel(color) {
    const g = new THREE.Group();
    const uni = new THREE.MeshLambertMaterial({ color: color });
    const legMat = new THREE.MeshLambertMaterial({ color: 0x3a3a3a });
    const skin = new THREE.MeshLambertMaterial({ color: 0xd8b08c });
    const gear = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const hits = [];
    function part(geo, mat, x, y, z, tag) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.castShadow = true;
      m.userData.part = tag;
      g.add(m);
      hits.push(m);
      return m;
    }
    part(new THREE.BoxGeometry(0.35, 0.8, 0.35), legMat, -0.18, 0.4, 0, 'legs');
    part(new THREE.BoxGeometry(0.35, 0.8, 0.35), legMat, 0.18, 0.4, 0, 'legs');
    part(new THREE.BoxGeometry(0.8, 0.9, 0.45), uni, 0, 1.25, 0, 'body');
    part(new THREE.BoxGeometry(0.22, 0.75, 0.22), uni, -0.55, 1.25, 0, 'body');
    part(new THREE.BoxGeometry(0.22, 0.75, 0.22), uni, 0.55, 1.25, 0, 'body');
    part(new THREE.SphereGeometry(0.22, 12, 10), skin, 0, 1.8, 0, 'head');
    part(new THREE.BoxGeometry(0.5, 0.18, 0.5), gear, 0, 1.95, 0, 'head');
    // Gun (visual only)
    const bg = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.6), gear);
    bg.position.set(0.3, 1.3, -0.35);
    g.add(bg);
    return { group: g, hits: hits };
  }

  const BOTS = [];
  const SPH_BODY = new THREE.Sphere(new THREE.Vector3(), 0.5);
  const SPH_HEAD = new THREE.Sphere(new THREE.Vector3(), 0.25);

  function pickSpawn(self) {
    const others = [P, ...BOTS].filter(e => e !== self && (e === P ? P.alive : !e.dead));
    const scored = SPAWNS.map(s => ({
      s: s,
      d: others.length ? Math.min(...others.map(e => Math.hypot(s.x - e.x, s.z - e.z))) : 999
    }));
    scored.sort((a, b) => b.d - a.d);
    const top = scored.slice(0, 4);
    return top[Math.floor(Math.random() * top.length)].s;
  }

  function createBot(index, tierKey) {
    const t = TIERS[tierKey];
    const model = makeBotModel(t.color);
    scene.add(model.group);
    const b = {
      name: t.name + '-0' + (index + 1),
      t: t, group: model.group, hits: model.hits,
      x: 0, z: 0, yaw: 0, hp: 100, dead: false, respT: 0,
      state: 'roam', fireCd: 0, seenT: 0, lostT: 0, searchT: 0,
      lastSeen: null, wp: null, strafeDir: Math.random() < 0.5 ? 1 : -1, strafeT: 1,
      stuckT: 0, lastX: 0, lastZ: 0, sinceHit: 99
    };
    model.hits.forEach(m => { m.userData.bot = b; });
    placeBot(b);
    BOTS.push(b);
    return b;
  }

  function placeBot(b) {
    const s = pickSpawn(b);
    b.x = s.x + rnd(-1, 1);
    b.z = s.z + rnd(-1, 1);
    resolve(b, 0.45);
    b.lastX = b.x; b.lastZ = b.z;
    b.yaw = rnd(0, Math.PI * 2);
    b.group.rotation.set(0, b.yaw, 0);
    b.group.position.set(b.x, 0, b.z);
  }

  function setState(b, s) {
    b.state = s;
    b.searchT = 0;
    b.wp = null;
  }

  function pickWP(b) {
    for (let i = 0; i < 8; i++) {
      const w = WPS[Math.floor(Math.random() * WPS.length)];
      if (Math.hypot(w.x - b.x, w.z - b.z) > 6) return w;
    }
    return WPS[0];
  }

  function pickCover(b) {
    let best = null, bestD = 1e9;
    for (const w of WPS) {
      const d = Math.hypot(w.x - b.x, w.z - b.z);
      if (d > 14 || d >= bestD) continue;
      if (!hasLOS(w.x, 1.2, w.z, P.x, 1.1, P.z)) { best = w; bestD = d; }
    }
    return best || pickWP(b);
  }

  // Move toward a point; returns true if arrived
  function moveTo(e, tx, tz, speed, dt) {
    const dx = tx - e.x, dz = tz - e.z, d = Math.hypot(dx, dz);
    if (d < 0.15) return true;
    const s = Math.min(d, speed * dt);
    e.x += dx / d * s;
    e.z += dz / d * s;
    resolve(e, 0.45);
    return false;
  }

  function turnTo(e, tx, tz, dt) {
    const target = Math.atan2(-(tx - e.x), -(tz - e.z));
    let diff = target - e.yaw;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    e.yaw += diff * Math.min(1, dt * 8);
  }

  const _bRay = new THREE.Ray();
  function botShoot(b) {
    if (!P.alive) return;
    const dist = Math.hypot(P.x - b.x, P.z - b.z);
    const err = b.t.spread * dist;
    const tx = P.x + rnd(-err, err);
    const ty = 1.1 + rnd(-err, err) * 0.6;
    const tz = P.z + rnd(-err, err);
    _o.set(b.x, 1.45, b.z);
    _d.set(tx - b.x, ty - 1.45, tz - b.z).normalize();

    let endD = 200;
    _ray.set(_o, _d);
    _ray.far = 200;
    const wh = _ray.intersectObjects(wallMeshes, false);
    if (wh.length) endD = wh[0].distance;

    SPH_BODY.center.set(P.x, 1.1, P.z);
    SPH_HEAD.center.set(P.x, 1.6, P.z);
    _bRay.set(_o, _d);
    let hitPlayer = false;
    if (_bRay.intersectSphere(SPH_BODY, _tmp)) {
      const d = _o.distanceTo(_tmp);
      if (d < endD) { endD = d; hitPlayer = true; }
    }
    if (_bRay.intersectSphere(SPH_HEAD, _tmp)) {
      const d = _o.distanceTo(_tmp);
      if (d < endD) { endD = d; hitPlayer = true; }
    }

    const from = _o.clone();
    const end = _o.clone().addScaledVector(_d, endD);
    tracer(from, end, 0xffaa33);
    if (hitPlayer) {
      spark(end, 0xff3b3b);
      damagePlayer(CFG.BDMG, b.name);
    } else if (wh.length) {
      spark(end, 0xd9b77e);
    }
  }

  function botKilled(b, headshot) {
    b.dead = true;
    b.respT = CFG.BRESP;
    b.group.rotation.x = -Math.PI / 2;
    b.group.position.y = 0.05;
    K.kills++;
    feed('You eliminated ' + b.name + (headshot ? ' (HEADSHOT)' : ''), '#ffd98a');
    showMsg(headshot ? 'HEADSHOT!' : 'ELIMINATED');
  }

  function respawnBot(b) {
    b.dead = false;
    b.hp = 100;
    b.sinceHit = 99;
    b.lastSeen = null;
    b.seenT = 0;
    b.lostT = 99;
    b.group.rotation.set(0, 0, 0);
    setState(b, 'roam');
    placeBot(b);
  }

  function updateBot(b, dt) {
    if (b.dead) {
      b.respT -= dt;
      if (b.respT <= 0) respawnBot(b);
      return;
    }
    const t = b.t;
    b.fireCd -= dt;
    b.sinceHit += dt;
    if (b.sinceHit > 4 && b.hp < 100) b.hp = Math.min(100, b.hp + 6 * dt);

    // Stuck detection
    b.stuckT += dt;
    if (b.stuckT >= 0.8) {
      if (Math.hypot(b.x - b.lastX, b.z - b.lastZ) < 0.15 && (b.state === 'roam' || b.state === 'search')) {
        b.wp = null;
      }
      b.lastX = b.x; b.lastZ = b.z; b.stuckT = 0;
    }

    // Perception
    const dist = Math.hypot(P.x - b.x, P.z - b.z);
    const see = P.alive && dist < 55 && hasLOS(b.x, 1.6, b.z, P.x, 1.1, P.z);
    if (see) {
      b.lastSeen = { x: P.x, z: P.z };
      b.seenT += dt;
      b.lostT = 0;
    } else {
      b.seenT = 0;
      b.lostT += dt;
    }
    const aware = see && b.seenT >= t.reaction;

    // State transitions
    if (b.state === 'roam') {
      if (aware) setState(b, 'combat');
    } else if (b.state === 'combat') {
      if (b.hp < 30) setState(b, 'cover');
      else if (!see && b.lostT > 1.5) setState(b, 'search');
    } else if (b.state === 'search') {
      if (aware) setState(b, 'combat');
      else if (b.searchT > 5) setState(b, 'roam');
    } else if (b.state === 'cover') {
      if (b.hp >= 60 || b.lostT > 3) setState(b, (see && P.alive) ? 'combat' : 'roam');
    }

    // State behaviour
    b.searchT += dt;
    switch (b.state) {
      case 'roam': {
        if (!b.wp) b.wp = pickWP(b);
        turnTo(b, b.wp.x, b.wp.z, dt);
        if (moveTo(b, b.wp.x, b.wp.z, t.speed * 0.6, dt)) b.wp = null;
        break;
      }
      case 'search': {
        if (!b.lastSeen) { setState(b, 'roam'); break; }
        turnTo(b, b.lastSeen.x, b.lastSeen.z, dt);
        if (moveTo(b, b.lastSeen.x, b.lastSeen.z, t.speed * 0.8, dt)) setState(b, 'roam');
        break;
      }
      case 'combat': {
        turnTo(b, P.x, P.z, dt);
        const dd = Math.max(dist, 0.01);
        const dx = (P.x - b.x) / dd, dz = (P.z - b.z) / dd;
        let mx = 0, mz = 0;
        if (dist > t.pref + 3) { mx += dx; mz += dz; }
        else if (dist < t.pref - 3) { mx -= dx; mz -= dz; }
        mx += -dz * b.strafeDir * 0.9;
        mz += dx * b.strafeDir * 0.9;
        const ml = Math.hypot(mx, mz) || 1;
        const s = t.speed * dt;
        const ox = b.x, oz = b.z;
        b.x += mx / ml * s;
        b.z += mz / ml * s;
        resolve(b, 0.45);
        if (Math.hypot(b.x - ox, b.z - oz) < s * 0.3) b.strafeDir *= -1; // blocked, reverse
        b.strafeT -= dt;
        if (b.strafeT <= 0) {
          b.strafeDir *= -1;
          b.strafeT = rnd(t.strafeMin, t.strafeMax);
        }
        if (see && aware && b.fireCd <= 0) {
          botShoot(b);
          b.fireCd = t.fire;
        }
        break;
      }
      case 'cover': {
        if (!b.wp) b.wp = pickCover(b);
        const arrived = Math.hypot(b.wp.x - b.x, b.wp.z - b.z) < 0.5;
        if (!arrived) {
          turnTo(b, b.wp.x, b.wp.z, dt);
          moveTo(b, b.wp.x, b.wp.z, t.speed * 1.1, dt);
        } else if (see) {
          turnTo(b, P.x, P.z, dt);
          if (aware && b.fireCd <= 0) {
            botShoot(b);
            b.fireCd = t.fire;
          }
        }
        break;
      }
    }
  }

  // Create the 3 bots: one New, one Pro, one Ultra
  function initBots() {
    BOTS.forEach(b => scene.remove(b.group));
    BOTS.length = 0;
    createBot(0, 'NEW');
    createBot(1, 'PRO');
    createBot(2, 'ULTRA');
  }

  // ---------- Player ----------
  const P = {
    x: 0, y: 0, z: 0, vy: 0, onGround: true, yaw: 0, pitch: 0,
    hp: 100, alive: true, respT: 0,
    mag: CFG.MAG, res: CFG.RES, reloadT: 0, fireCd: 0,
    bloom: 0, kick: 0, moveAmt: 0, bobT: 0, damageT: 0, lastHitBy: ''
  };
  const K = { kills: 0, deaths: 0 };

  function respawnPlayer() {
    const s = pickSpawn(P);
    P.x = s.x + rnd(-1, 1);
    P.z = s.z + rnd(-1, 1);
    resolve(P, CFG.R);
    P.y = 0; P.vy = 0; P.onGround = true;
    P.hp = 100; P.alive = true; P.reloadT = 0;
    P.yaw = Math.atan2(-(0 - P.x), -(0 - P.z));
    P.pitch = 0;
    $('deathScreen').classList.add('hidden');
  }

  function killPlayer(by) {
    P.alive = false;
    P.respT = CFG.PRESP;
    P.reloadT = 0;
    K.deaths++;
    feed(by + ' eliminated YOU', '#ff6b6b');
    $('deathScreen').classList.remove('hidden');
  }

  function damagePlayer(dmg, by) {
    if (!P.alive) return;
    P.hp -= dmg;
    P.damageT = 0.35;
    P.lastHitBy = by;
    if (P.hp <= 0) {
      P.hp = 0;
      killPlayer(by);
    }
  }

  function startReload() {
    if (P.reloadT > 0 || P.res <= 0 || P.mag === CFG.MAG || !P.alive) return;
    P.reloadT = CFG.RELOAD;
  }

  let locked = false;
  let mouseDown = false;
  const hitMarkerEl = $('hitmarker');
  let hitMarkerT = 0;

  function playerShoot() {
    if (!P.alive || P.reloadT > 0 || P.fireCd > 0) return;
    if (P.mag <= 0) { startReload(); return; }
    P.mag--;
    P.fireCd = CFG.FIRE;
    P.kick = 1;
    P.pitch = clamp(P.pitch + 0.008, -1.4, 1.4);
    P.yaw += (Math.random() - 0.5) * 0.004;
    P.bloom = Math.min(0.03, P.bloom + 0.004);

    const spread = 0.002 + P.moveAmt * 0.02 + P.bloom;
    camera.updateMatrixWorld();
    const camPos = new THREE.Vector3();
    camera.getWorldPosition(camPos);
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);
    const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
    const up = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);
    dir.addScaledVector(right, rnd(-spread, spread)).addScaledVector(up, rnd(-spread, spread)).normalize();

    const targets = wallMeshes.concat(BOTS.reduce((arr, b) => arr.concat(b.hits), []));
    _ray.set(camPos, dir);
    _ray.far = 300;
    const hits = _ray.intersectObjects(targets, false).filter(h => !(h.object.userData.bot && h.object.userData.bot.dead));

    const muzzle = muzzleWorld();
    let end = camPos.clone().addScaledVector(dir, 100);
    let hitBot = null, part = null;
    if (hits.length) {
      const h = hits[0];
      end = h.point.clone();
      if (h.object.userData.bot) {
        hitBot = h.object.userData.bot;
        part = h.object.userData.part;
      }
    }

    tracer(muzzle, end, 0xfff2a0);
    spark(muzzle, 0xffcc66);

    if (hitBot) {
      let dmg = CFG.PDMG;
      const head = part === 'head';
      if (head) dmg *= CFG.HEADX;
      hitBot.hp -= dmg;
      hitBot.sinceHit = 0;
      // Being shot makes the bot instantly aware of the player
      hitBot.lastSeen = { x: P.x, z: P.z };
      hitBot.seenT = hitBot.t.reaction;
      hitBot.lostT = 0;
      hitMarkerT = 0.12;
      spark(end, head ? 0xffffff : 0xff3b3b);
      if (hitBot.hp <= 0) botKilled(hitBot, head);
    } else if (hits.length) {
      spark(end, 0xd9b77e);
    }
  }

  // ---------- Input ----------
  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
    if (e.code === 'KeyR') startReload();
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });
  window.addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
    mouseDown = false;
  });

  document.addEventListener('mousemove', e => {
    if (!locked || !P.alive) return;
    P.yaw -= e.movementX * CFG.SENS;
    P.pitch = clamp(P.pitch - e.movementY * CFG.SENS, -1.4, 1.4);
  });
  document.addEventListener('mousedown', e => { if (e.button === 0 && locked) mouseDown = true; });
  document.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

  function requestLock() {
    try { renderer.domElement.requestPointerLock(); } catch (e) { /* ignore */ }
  }

  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === renderer.domElement;
    $('pauseScreen').classList.toggle('hidden', !started || locked);
    if (!locked) mouseDown = false;
  });
  document.addEventListener('pointerlockerror', () => {
    $('pauseScreen').querySelector('p').textContent = 'Mouse capture fail hua. Page par dobara click karein.';
  });
  $('pauseScreen').addEventListener('click', requestLock);

  // ---------- HUD ----------
  const feedEl = $('feed');
  const msgEl = $('msg');
  let msgT = 0;

  function feed(text, color) {
    const d = document.createElement('div');
    d.textContent = text;
    d.style.color = color || '#fff';
    feedEl.insertBefore(d, feedEl.firstChild);
    while (feedEl.children.length > 5) feedEl.removeChild(feedEl.lastChild);
    setTimeout(() => { if (d.parentNode) d.parentNode.removeChild(d); }, 4000);
  }

  function showMsg(text) {
    msgEl.textContent = text;
    msgT = 1.6;
  }

  function updateHUD(dt) {
    $('kd').textContent = 'K ' + K.kills + '   D ' + K.deaths;
    const alive = BOTS.filter(b => !b.dead).length;
    $('enemies').textContent = 'BOTS ALIVE: ' + alive + ' / ' + BOTS.length;
    $('health').textContent = 'HP ' + Math.ceil(P.hp);
    $('health').style.color = P.hp > 40 ? '#fff' : '#ff5555';
    $('ammo').innerHTML = P.reloadT > 0
      ? 'RELOADING <small>...</small>'
      : P.mag + ' / ' + P.res;

    hitMarkerT -= dt;
    hitMarkerEl.style.opacity = hitMarkerT > 0 ? 1 : 0;

    msgT -= dt;
    msgEl.style.opacity = msgT > 0 ? Math.min(1, msgT) : 0;

    $('vignette').style.opacity = P.damageT > 0 ? Math.min(0.7, P.damageT * 2) : 0;
  }

  // ---------- Update ----------
  function updatePlayer(dt) {
    P.fireCd -= dt;
    P.damageT -= dt;
    P.bloom = Math.max(0, P.bloom - dt * 0.08);

    if (!P.alive) {
      P.respT -= dt;
      $('respawnText').textContent = 'Respawn in ' + Math.max(0, Math.ceil(P.respT)) + '...';
      if (P.respT <= 0) respawnPlayer();
      return;
    }

    if (P.reloadT > 0) {
      P.reloadT -= dt;
      if (P.reloadT <= 0) {
        const take = Math.min(CFG.MAG - P.mag, P.res);
        P.mag += take;
        P.res -= take;
        P.reloadT = 0;
      }
    }

    const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0);
    const r = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    let mx = -Math.sin(P.yaw) * f + Math.cos(P.yaw) * r;
    let mz = -Math.cos(P.yaw) * f - Math.sin(P.yaw) * r;
    const ml = Math.hypot(mx, mz);
    P.moveAmt = 0;
    if (ml > 0) {
      mx /= ml; mz /= ml;
      const sprint = (keys.ShiftLeft || keys.ShiftRight) && f > 0 && P.reloadT <= 0;
      const sp = sprint ? CFG.SPRINT : CFG.WALK;
      P.x += mx * sp * dt;
      P.z += mz * sp * dt;
      P.moveAmt = sprint ? 1 : 0.6;
    }
    resolve(P, CFG.R);

    if (keys.Space && P.onGround) {
      P.vy = CFG.JUMP;
      P.onGround = false;
    }
    P.vy += CFG.GRAV * dt;
    P.y += P.vy * dt;
    if (P.y <= 0) { P.y = 0; P.vy = 0; P.onGround = true; }

    P.bobT += dt * (P.moveAmt > 0 ? 9 : 0);

    if (mouseDown) playerShoot();
  }

  function updateCameraAndGun(dt) {
    const bob = P.moveAmt > 0 ? Math.sin(P.bobT) * 0.035 : 0;
    camera.position.set(P.x, P.y + CFG.EYE + bob, P.z);
    camera.rotation.set(P.pitch, P.yaw, 0);

    P.kick = Math.max(0, P.kick - dt * 4);
    const prog = P.reloadT > 0 ? 1 - P.reloadT / CFG.RELOAD : 0;
    const dip = P.reloadT > 0 ? Math.sin(prog * Math.PI) * 0.2 : 0;
    gun.position.set(0.28, -0.26 - dip, 0);
    gun.rotation.set(P.kick * 0.25, 0, 0);
  }

  function update(dt) {
    updatePlayer(dt);
    for (const b of BOTS) updateBot(b, dt);
    updateCameraAndGun(dt);
    updateEffects(dt);
    updateHUD(dt);
  }

  // ---------- Start ----------
  let started = false;

  $('startBtn').addEventListener('click', () => {
    if (started) return;
    started = true;
    K.kills = 0; K.deaths = 0;
    P.alive = true; P.hp = 100; P.mag = CFG.MAG; P.res = CFG.RES; P.reloadT = 0;
    const s = SPAWNS[0];
    P.x = s.x; P.z = s.z; P.y = 0; P.vy = 0; P.onGround = true;
    P.yaw = Math.atan2(-(0 - P.x), -(0 - P.z));
    P.pitch = 0;
    initBots();
    $('startScreen').classList.add('hidden');
    $('hud').classList.remove('hidden');
    showMsg('MATCH START');
    requestLock();
  });

  // ---------- Resize ----------
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (started && locked) update(dt);
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);

  loadStatus.textContent = 'Ready. START MATCH par click karein.';
})();
</script>
</body>

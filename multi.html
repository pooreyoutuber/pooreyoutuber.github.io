<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Online Video Trim Free | Trim MP4, WebM &amp; MOV Videos</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #f4f6fb;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #475569;
    --danger: #991b1b;
    --danger-bg: #fef2f2;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; }
  .btn { padding: 10px 16px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background: var(--primary); color: #fff; text-decoration: none; display: inline-block; }
  .btn:hover { background: var(--primary-hover); }
  .btn-sec { background: #e2e8f0; color: var(--text); }
  .dropzone { border: 2px dashed #c7d2fe; padding: 40px; text-align: center; border-radius: var(--radius); cursor: pointer; }
  video { width: 100%; border-radius: 8px; background: #000; margin-top: 10px; }
  .inputs { display: flex; gap: 10px; margin: 15px 0; }
  .inputs div { flex: 1; }
  input[type="text"] { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; }
  .msg { padding: 10px; border-radius: 6px; margin-top: 10px; font-size: 0.9rem; }
  .msg-err { background: var(--danger-bg); color: var(--danger); }
</style>
</head>
<body>

<div class="container">
  <h2>Video Trimmer Tool</h2>

  <!-- Upload Section -->
  <div class="card" id="uploadCard">
    <div class="dropzone" id="dropzone">
      <h3>Select or Drop Video File</h3>
      <input type="file" id="fileInput" accept="video/*" hidden />
      <button class="btn" onclick="document.getElementById('fileInput').click()">Choose File</button>
    </div>
    <div id="uploadErr" class="msg msg-err" style="display:none;"></div>
  </div>

  <!-- Editor Section -->
  <div class="card" id="editorCard" style="display:none;">
    <video id="preview" controls></video>
    <div class="inputs">
      <div>
        <label>Start Time (seconds or MM:SS)</label>
        <input type="text" id="startTime" value="00:00" />
      </div>
      <div>
        <label>End Time (seconds or MM:SS)</label>
        <input type="text" id="endTime" value="00:05" />
      </div>
    </div>
    <button class="btn" id="trimBtn">Trim Video</button>
    <div id="status" class="msg" style="display:none;"></div>
  </div>

  <!-- Result Section -->
  <div class="card" id="resultCard" style="display:none;">
    <h3>Trimmed Video Output</h3>
    <video id="resultVideo" controls></video>
    <br/><br/>
    <a id="downloadBtn" class="btn" download="trimmed-video.mp4">Download Trimmed Video</a>
  </div>
</div>

<!-- Simple Fast Canvas-based Trimmer Fallback Script -->
<script>
const fileInput = document.getElementById('fileInput');
const uploadCard = document.getElementById('uploadCard');
const editorCard = document.getElementById('editorCard');
const resultCard = document.getElementById('resultCard');
const preview = document.getElementById('preview');
const resultVideo = document.getElementById('resultVideo');
const trimBtn = document.getElementById('trimBtn');
const status = document.getElementById('status');
const downloadBtn = document.getElementById('downloadBtn');

let currentFile = null;

fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  currentFile = file;
  preview.src = URL.createObjectURL(file);
  uploadCard.style.display = 'none';
  editorCard.style.display = 'block';
});

function parseToSeconds(str) {
  const p = str.toString().split(':');
  if (p.length === 2) return parseFloat(p[0]) * 60 + parseFloat(p[1]);
  if (p.length === 3) return parseFloat(p[0]) * 3600 + parseFloat(p[1]) * 60 + parseFloat(p[2]);
  return parseFloat(str) || 0;
}

trimBtn.addEventListener('click', async () => {
  const start = parseToSeconds(document.getElementById('startTime').value);
  const end = parseToSeconds(document.getElementById('endTime').value);

  if (end <= start) {
    alert('End time must be greater than start time!');
    return;
  }

  status.style.display = 'block';
  status.innerText = 'Trimming video in browser... Please wait.';
  trimBtn.disabled = true;

  try {
    const stream = preview.captureStream ? preview.captureStream() : preview.mozCaptureStream();
    const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = [];

    mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
    mediaRecorder.onstop = () => {
      const blob = new Blob(chunks, { type: 'video/webm' });
      const url = URL.createObjectURL(blob);

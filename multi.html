<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PooreYoutuber Agent</title>
    <!-- Google Fonts for Gemini-like Clean UI -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #1f1f1f;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header & Navigation Style */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
        }

        .logo {
            font-size: 1.2rem;
            font-weight: 600;
            color: #1f1f1f;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 6px 14px;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            background: #f9fafb;
            font-weight: 500;
            color: #374151 !important;
            text-decoration: none;
            display: inline-block;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: #f3f4f6;
            border-color: #9ca3af;
        }

        .donate-coffee-btn {
            padding: 6px 14px;
            border-radius: 20px;
            background: #ffdd00;
            color: #000 !important;
            font-weight: 600;
            text-decoration: none;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .donate-coffee-btn:hover {
            background: #facc15;
        }

        /* Main Container */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 850px;
            width: 100%;
            margin: 0 auto;
            padding: 20px 16px;
            height: calc(100vh - 65px);
        }

        /* Chat History Scroll Area */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            font-size: 0.95rem;
            line-height: 1.6;
            word-break: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: #f3f4f6;
            color: #1f1f1f;
            padding: 12px 18px;
            border-radius: 18px 18px 4px 18px;
        }

        .agent-message {
            align-self: flex-start;
            background-color: #ffffff;
            color: #1f1f1f;
            padding: 12px 0;
            border-radius: 0;
            width: 100%;
        }

        .agent-avatar {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, #4285f4, #9b51e0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 14px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .agent-content {
            flex: 1;
            white-space: pre-wrap;
        }

        /* Input Area (Gemini Style Floating Box) */
        .input-container {
            padding: 10px 0 20px 0;
            background: #ffffff;
        }

        .input-box {
            display: flex;
            align-items: center;
            background: #f0f4f9;
            border-radius: 28px;
            padding: 8px 16px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            border-color: #c7d2fe;
            background: #ffffff;
            box-shadow: 0 1px 6px rgba(32,33,36,0.18);
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            resize: none;
            height: 24px;
            max-height: 120px;
            font-size: 1rem;
            color: #1f1f1f;
            padding: 2px 8px;
        }

        .send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: #0b57d0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #e0e7ff;
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .loading {
            font-style: italic;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <!-- Header Navigation Section -->
    <header>
        <a href="https://pooreyoutuber.github.io/" class="logo">
            ✨ PooreYoutuber Agent
        </a>
        <nav class="nav-links">
            <a href="https://pooreyoutuber.github.io/" class="nav-btn">🚀 PooreYoutuber</a>
            <a href="https://pooreyoutuber.github.io/" class="nav-btn">Home</a>
            <a href="https://pooreyoutuber.github.io/viralreel-multi-viewer.html" class="nav-btn">ViralReel Viewer</a>
            <a href="https://www.amazon.com/s?i=fashion-mens-intl-ship&bbn=16225019011&rh=n%3A7141123011%2Cn%3A16225019011%2Cn%3A7147441011%2Cn%3A1040658%2Cn%3A15697821011&dc=&ds=v1%3A%2BcjJStJY0S4ekGo6W1WjS2TTbZ6dAsHfR2iGhsGG688&qid=1788252554&rnid=1040658&linkCode=ll2&tag=pooreyoutuber-20&linkId=bb68d90582861a2a46445bb453b20f90&language=en_US&ref_=as_li_ss_tl" target="_blank" rel="nofollow" class="nav-btn">🇺🇸 US Deals</a>
            <a href="donation.html" class="donate-coffee-btn">☕ Buy me a coffee</a>
        </nav>
    </header>

    <!-- Chat Container -->
    <div class="container">
        <div class="chat-box" id="chatBox">
            <div class="message agent-message">
                <div class="agent-avatar">P</div>
                <div class="agent-content">Namaste! Main **PooreYoutuber Agent** hoon. Main aapki kya madad kar sakta hoon?</div>
            </div>
        </div>

        <!-- Floating Input Bar -->
        <div class="input-container">
            <div class="input-box">
                <textarea id="userInput" placeholder="PooreYoutuber Agent se kuch bhi pucho..." rows="1" onkeydown="handleKeyPress(event)"></textarea>
                <button class="send-btn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');
        const BACKEND_URL = 'https://pooreyoutuber-github-io-luly.onrender.com/chatbot';

        // Textarea height auto-adjust
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight - 4, 120) + 'px';
        });

        function handleKeyPress(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (!messageText) return;

            // Render User Message
            appendMessage(messageText, 'user-message');
            userInput.value = '';
            userInput.style.height = '24px';

            // Loading Message placeholder
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message agent-message loading';
            loadingDiv.innerHTML = `<div class="agent-avatar">P</div><div class="agent-content">PooreYoutuber Agent soch raha hai... (Render cold-start me 10-20sec lag sakte hain)</div>`;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                
                // Remove Loading
                if (chatBox.contains(loadingDiv)) {
                    chatBox.removeChild(loadingDiv);
                }

                if (response.ok && (data.reply || data.response)) {
                    const reply = data.reply || data.response;
                    appendAgentMessage(reply);
                } else {
                    const errorMsg = data.error || "Server se koi sahi response nahi mila.";
                    appendAgentMessage(` Error: ${errorMsg}`);
                }

            } catch (error) {
                if (chatBox.contains(loadingDiv)) {
                    chatBox.removeChild(loadingDiv);
                }
                appendAgentMessage(" Maaf kijiye, Server se connect hone me samasya aa rahi hai. Kripya 10-15 seconds baad dubara try karein.");
                console.error("Fetch Error:", error);
            }
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function appendAgentMessage(text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message agent-message';
            
            const avatar = document.createElement('div');
            avatar.className = 'agent-avatar';
            avatar.innerText = 'P';

            const content = document.createElement('div');
            content.className = 'agent-content';
            content.innerText = text;

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(content);

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Poly Battle Royale Prototype</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.8);
            border: 2px solid black;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #ui {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-size: 18px;
            pointer-events: none;
        }

        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 10px;
            cursor: pointer;
        }

        #health-bar-container {
            width: 200px;
            height: 20px;
            background-color: #333;
            border: 2px solid #fff;
            margin-top: 5px;
        }

        #health-bar {
            width: 100%;
            height: 100%;
            background-color: #2ecc71;
            transition: width 0.1s;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">
        <div>Alive: <span id="alive-count">1</span></div>
        <div>Kills: <span id="kill-count">0</span></div>
        <div>Health:</div>
        <div id="health-bar-container">
            <div id="health-bar"></div>
        </div>
    </div>

    <div id="instructions">
        <h1>Click to Play</h1>
        <p>WASD = Move | Space = Jump | Shift = Sprint</p>
        <p>Mouse = Aim | Left Click = Shoot</p>
    </div>

    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        // --- Game Engine Setup ---
        let scene, camera, renderer, world;
        let clock = new THREE.Clock();
        
        // --- Entities & Controls ---
        let playerBody, playerMesh;
        let cameraOffset = new THREE.Vector3(0, 2.5, 4.5);
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, isSprinting = false;
        let yaw = 0, pitch = 0;
        let isLocked = false;
        
        // --- Player State ---
        let health = 100;
        let kills = 0;
        let bullets = [];
        let cannonBullets = [];

        const instructions = document.getElementById('instructions');

        init();
        animate();

        function init() {
            // 1. Scene & Physics World
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue
            scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

            world = new CANNON.World();
            world.gravity.set(0, -19.62, 0); // Natural falling speed

            // 2. Camera & Renderer
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 3. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // 4. Ground Environment
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x557a2b });
            const groundGeo = new THREE.PlaneGeometry(300, 300);
            const groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            const groundBody = new CANNON.Body({
                mass: 0, // Static
                shape: new CANNON.Plane()
            });
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            // Populate Map Environment (Trees/Obstacles)
            generateMapDecorations();

            // 5. Player Creation
            createPlayer();

            // 6. Event Listeners
            window.addEventListener('resize', onWindowResize);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mousedown', shoot);

            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    isLocked = true;
                    instructions.style.display = 'none';
                } else {
                    isLocked = false;
                    instructions.style.display = 'block';
                }
            });
        }

        function createPlayer() {
            // Physics Body (Capsule replacement using Cylinder/Sphere combo)
            const radius = 0.5;
            const height = 1.8;
            const playerShape = new CANNON.Cylinder(radius, radius, height, 8);
            
            playerBody = new CANNON.Body({
                mass: 70,
                shape: playerShape,
                fixedRotation: true
            });
            playerBody.position.set(0, 5, 0);
            world.addBody(playerBody);

            // Visual Mesh (Low-Poly Character Placeholder)
            const group = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CylinderGeometry(radius, radius, height, 8);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x2c3e50 });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.castShadow = true;
            group.add(bodyMesh);

            // Head
            const headGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c });
            const headMesh = new THREE.Mesh(headGeo, headMat);
            headMesh.position.y = 1.1;
            headMesh.castShadow = true;
            group.add(headMesh);

            // Gun Placeholder
            const gunGeo = new THREE.BoxGeometry(0.1, 0.1, 0.6);
            const gunMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const gunMesh = new THREE.Mesh(gunGeo, gunMat);
            gunMesh.position.set(0.4, 0.2, -0.4);
            group.add(gunMesh);

            playerMesh = group;
            scene.add(playerMesh);
        }

        function generateMapDecorations() {
            const treeGeo = new THREE.ConeGeometry(2, 6, 5);
            const treeMat = new THREE.MeshStandardMaterial({ color: 0x1e824c });
            const trunkGeo = new THREE.CylinderGeometry(0.4, 0.4, 2, 5);
            const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7d5fff });

            for (let i = 0; i < 60; i++) {
                const x = (Math.random() - 0.5) * 250;
                const z = (Math.random() - 0.5) * 250;

                const treeGroup = new THREE.Group();
                const leaves = new THREE.Mesh(treeGeo, treeMat);
                leaves.position.y = 4;
                leaves.castShadow = true;

                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = 1;
                trunk.castShadow = true;

                treeGroup.add(leaves);
                treeGroup.add(trunk);
                treeGroup.position.set(x, 0, z);
                scene.add(treeGroup);

                // Simple collision for trees
                const treeBody = new CANNON.Body({
                    mass: 0,
                    shape: new CANNON.Cylinder(0.5, 0.5, 6, 8)
                });
                treeBody.position.set(x, 3, z);
                world.addBody(treeBody);
            }
        }

        // --- Controls Handling ---
        function onKeyDown(e) {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'ShiftLeft': isSprinting = true; break;
                case 'Space': 
                    // Jump check (simple velocity check)
                    if (Math.abs(playerBody.velocity.y) < 0.05) {
                        playerBody.velocity.y = 8;
                    }
                    break;
            }
        }

        function onKeyUp(e) {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
                case 'ShiftLeft': isSprinting = false; break;
            }
        }

        function onMouseMove(e) {
            if (!isLocked) return;
            
            const sensitivity = 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;

            // Clamp pitch to avoid camera flipping
            pitch = Math.max(-Math.PI / 4, Math.min(Math.PI / 4, pitch));
        }

        // --- Combat System ---
        function shoot(e) {
            if (!isLocked || e.button !== 0) return; // Primary click only

            // Create Visual Bullet
            const bulletGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xf1c40f });
            const bulletMesh = new THREE.Mesh(bulletGeo, bulletMat);
            
            // Spawn position (Front of player)
            const spawnPos = new THREE.Vector3();
            playerMesh.getWorldPosition(spawnPos);
            spawnPos.y += 0.2; // Gun level
            
            bulletMesh.position.copy(spawnPos);
            scene.add(bulletMesh);

            // Cannon Physics Body for Bullet
            const bulletShape = new CANNON.Sphere(0.1);
            const bulletBody = new CANNON.Body({
                mass: 0.1,
                shape: bulletShape
            });
            bulletBody.position.copy(spawnPos);

            // Direct bullet vector based on current orientation
            const speed = 70;
            const shootDir = new THREE.Vector3(0, 0, -1);
            shootDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            
            bulletBody.velocity.set(
                shootDir.x * speed,
                shootDir.y * speed + (pitch * 10), // Pitch influence
                shootDir.z * speed
            );

            world.addBody(bulletBody);

            bullets.push(bulletMesh);
            cannonBullets.push(bulletBody);

            // Clean up old bullets after 2 seconds
            setTimeout(() => {
                scene.remove(bulletMesh);
                world.remove(bulletBody);
                bullets.shift();
                cannonBullets.shift();
            }, 2000);
        }

        // --- Core Loop & Logic ---
        function updatePlayerMovement() {
            if (!isLocked) return;

            const speed = isSprinting ? 12 : 6;
            let inputVector = new THREE.Vector3();

            if (moveForward) inputVector.z -= 1;
            if (moveBackward) inputVector.z += 1;
            if (moveLeft) inputVector.x -= 1;
            if (moveRight) inputVector.x += 1;

            inputVector.normalize();

            // Rotate input direction according to camera yaw
            const moveDir = inputVector.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            // Update Velocity
            playerBody.velocity.x = moveDir.x * speed;
            playerBody.velocity.z = moveDir.z * speed;

            // Sync visual mesh orientation with camera yaw
            playerMesh.rotation.y = yaw;
        }

        function updateCamera() {
            // Position camera behind player based on offset and orientation
            const rotatedOffset = cameraOffset.clone().applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
            rotatedOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            camera.position.copy(playerMesh.position).add(rotatedOffset);
            
            // Camera looks at player chest level
            const targetPos = playerMesh.position.clone().add(new THREE.Vector3(0, 1, 0));
            camera.lookAt(targetPos);
        }

        function animate() {
            requestAnimationFrame(animate);

            const delta = clock.getDelta();

            // Step Physics World
            world.step(1 / 60, delta, 3);

            // Update Mechanics
            updatePlayerMovement();

            // Sync Visual Player Mesh with Cannon Body
            playerMesh.position.copy(playerBody.position);

            // Sync Visual Bullets with Physics Bodies
            for (let i = 0; i < bullets.length; i++) {
                bullets[i].position.copy(cannonBullets[i].position);
            }

            updateCamera();

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>

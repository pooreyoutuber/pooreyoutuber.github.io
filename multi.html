<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Unit - Retro Remake</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            border: 4px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            background: #000;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
        }
        canvas {
            display: block;
            background: #050505;
            image-rendering: pixelated;
            width: 360px;
            height: 480px;
        }
        .ui-panel {
            margin-top: 8px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            padding: 0 5px;
            color: #fff;
        }
        .controls-hint {
            margin-top: 6px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="ui-panel">
            <span id="scoreText">SCORE: 00000</span>
            <span id="livesText">LIVES: 3</span>
            <span id="waveText">WAVE: 1</span>
        </div>
        <canvas id="gameCanvas" width="240" height="320"></canvas>
        <div class="controls-hint">
            MOVE: Arrow Keys / WASD | SHOOT: Space | RESTART: Enter
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game States
        const STATE = { START: 0, PLAYING: 1, GAMEOVER: 2, WIN: 3 };
        let gameState = STATE.START;

        let score = 0;
        let lives = 3;
        let wave = 1;

        // Player Object
        let player = {
            x: 104,
            y: 270,
            width: 16,
            height: 16,
            speed: 2.5,
            color: '#00ffcc',
            cooldown: 0
        };

        let keys = {};
        let bullets = [];
        let enemies = [];
        let enemyBullets = [];
        let particles = [];
        let stars = [];

        // Initialize background stars
        for (let i = 0; i < 40; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                speed: 0.5 + Math.random() * 1.5,
                size: Math.random() > 0.8 ? 2 : 1
            });
        }

        function initWave() {
            bullets = [];
            enemyBullets = [];
            enemies = [];
            
            // Spawn enemy grid based on wave
            let rows = 3 + Math.min(wave, 3);
            let cols = 6;
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    enemies.push({
                        x: 25 + c * 32,
                        y: 30 + r * 22,
                        width: 14,
                        height: 12,
                        type: r === 0 ? 'elite' : 'normal',
                        alive: true,
                        dx: 0.8 + (wave * 0.1)
                    });
                }
            }
        }

        // Input Listeners
        window.addEventListener('keydown', e => {
            keys[e.code] = true;
            if (e.code === 'Space' || e.code === 'Enter') {
                if (gameState === STATE.START || gameState === STATE.GAMEOVER || gameState === STATE.WIN) {
                    resetGame();
                    gameState = STATE.PLAYING;
                }
            }
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
        });

        window.addEventListener('keyup', e => {
            keys[e.code] = false;
        });

        function resetGame() {
            score = 0;
            lives = 3;
            wave = 1;
            player.x = 104;
            player.y = 270;
            initWave();
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push({
                    x: x,
                    y: y,
                    dx: (Math.random() - 0.5) * 3,
                    dy: (Math.random() - 0.5) * 3,
                    life: 20 + Math.floor(Math.random() * 15),
                    color: color
                });
            }
        }

        function update() {
            // Update stars
            stars.forEach(s => {
                s.y += s.speed;
                if (s.y > canvas.height) s.y = 0;
            });

            if (gameState !== STATE.PLAYING) return;

            // Player Movement
            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 4) player.x -= player.speed;
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < canvas.width - player.width - 4) player.x += player.speed;
            if ((keys['ArrowUp'] || keys['KeyW']) && player.y > 140) player.y -= player.speed;
            if ((keys['ArrowDown'] || keys['KeyS']) && player.y < canvas.height - player.height - 4) player.y += player.speed;

            // Player Shooting
            if (player.cooldown > 0) player.cooldown--;
            if (keys['Space'] && player.cooldown === 0) {
                bullets.push({ x: player.x + player.width / 2 - 1.5, y: player.y, dy: -5, width: 3, height: 8 });
                player.cooldown = 15; // Fire rate delay
            }

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y += bullets[i].dy;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Collision with enemies
                let hit = false;
                for (let e of enemies) {
                    if (e.alive &&
                        bullets[i].x < e.x + e.width &&
                        bullets[i].x + bullets[i].width > e.x &&
                        bullets[i].y < e.y + e.height &&
                        bullets[i].y + bullets[i].height > e.y) {
                        e.alive = false;
                        hit = true;
                        score += e.type === 'elite' ? 200 : 100;
                        createExplosion(e.x + e.width/2, e.y + e.height/2, '#ff3333');
                        break;
                    }
                }
                if (hit) {
                    bullets.splice(i, 1);
                }
            }

            // Update Enemy Bullets
            for (let i = enemyBullets.length - 1; i >= 0; i--) {
                enemyBullets[i].y += enemyBullets[i].dy;
                if (enemyBullets[i].y > canvas.height) {
                    enemyBullets.splice(i, 1);
                    continue;
                }

                // Collision with player
                let eb = enemyBullets[i];
                if (eb.x < player.x + player.width &&
                    eb.x + eb.width > player.x &&
                    eb.y < player.y + player.height &&
                    eb.y + eb.height > player.y) {
                    enemyBullets.splice(i, 1);
                    lives--;
                    createExplosion(player.x + player.width/2, player.y + player.height/2, '#00ffcc');
                    if (lives <= 0) {
                        gameState = STATE.GAMEOVER;
                    }
                    break;
                }
            }

            // Update Enemies
            let edgeReached = false;
            let aliveCount = 0;
            enemies.forEach(e => {
                if (e.alive) {
                    aliveCount++;
                    e.x += e.dx;
                    if (e.x <= 10 || e.x >= canvas.width - e.width - 10) {
                        edgeReached = true;
                    }
                    // Random enemy shooting
                    if (Math.random() < 0.0015 * wave) {
                        enemyBullets.push({ x: e.x + e.width/2 - 1.5, y: e.y + e.height, dy: 2.5, width: 3, height: 7 });
                    }
                }
            });

            if (edgeReached) {
                enemies.forEach(e => {
                    e.dx *= -1;
                    e.y += 10;
                    if (e.y >= player.y - 10) {
                        gameState = STATE.GAMEOVER;
                    }
                });
            }

            // Check Wave Cleared
            if (aliveCount === 0) {
                wave++;
                if (wave > 3) {
                    gameState = STATE.WIN;
                } else {
                    initWave();
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.dx;
                p.y += p.dy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Update UI elements
            document.getElementById('scoreText').innerText = 'SCORE: ' + String(score).padStart(5, '0');
            document.getElementById('livesText').innerText = 'LIVES: ' + '❤️'.repeat(Math.max(0, lives));
            document.getElementById('waveText').innerText = 'WAVE: ' + wave;
        }

        function render() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            ctx.fillStyle = '#ffffff';
            stars.forEach(s => {
                ctx.fillRect(s.x, s.y, s.size, s.size);
            });

            if (gameState === STATE.START) {
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('SPECIAL UNIT', canvas.width / 2, 100);
                
                ctx.fillStyle = '#ffffff';
                ctx.font = '11px Courier New';
                ctx.fillText('RETRO BROWSER REMAKE', canvas.width / 2, 125);

                ctx.fillStyle = '#ffff00';
                ctx.fillText('PRESS SPACE / ENTER', canvas.width / 2, 190);
                ctx.fillText('TO START MISSION', canvas.width / 2, 210);
                return;
            }

            if (gameState === STATE.GAMEOVER) {
                ctx.fillStyle = '#ff3333';
                ctx.font = 'bold 18px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', canvas.width / 2, 120);
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Courier New';
                ctx.fillText('FINAL SCORE: ' + score, canvas.width / 2, 160);
                ctx.fillText('PRESS ENTER TO RETRY', canvas.width / 2, 210);
                return;
            }

            if (gameState === STATE.WIN) {
                ctx.fillStyle = '#00ffcc';
                ctx.font = 'bold 16px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('MISSION ACCOMPLISHED!', canvas.width / 2, 120);
                ctx.fillStyle = '#ffffff';
                ctx.font = '12px Courier New';
                ctx.fillText('FINAL SCORE: ' + score, canvas.width / 2, 160);
                ctx.fillText('PRESS ENTER TO REPLAY', canvas.width / 2, 210);
                return;
            }

            // Draw Player
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y + 4, player.width, player.height - 4);
            ctx.fillRect(player.x + 6, player.y, 4, 6); // Cannon

            // Draw Bullets
            ctx.fillStyle = '#ffff00';
            bullets.forEach(b => {
                ctx.fillRect(b.x, b.y, b.width, b.height);
            });

            // Draw Enemy Bullets
            ctx.fillStyle = '#ff5555';
            enemyBullets.forEach(eb => {
                ctx.fillRect(eb.x, eb.y, eb.width, eb.height);
            });

            // Draw Enemies
            enemies.forEach(e => {
                if (e.alive) {
                    ctx.fillStyle = e.type === 'elite' ? '#ff9900' : '#ff3333';
                    ctx.fillRect(e.x, e.y, e.width, e.height);
                    // Enemy eyes/details
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(e.x + 3, e.y + 3, 2, 2);
                    ctx.fillRect(e.x + 9, e.y + 3, 2, 2);
                }
            });

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 2, 2);
            });
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        initWave();
        gameLoop();
    </script>
</body>
</html>

    <style>
        body{

        .box{
            background:white;
            padding:30px;

            padding:12px 25px;

<body>

<div class="box">
    <h2>Subscribe to Watch Video</h2>
    <p>Please subscribe to our channel, then watch the video.</p>

    <button onclick="openLinks()">
        Subscribe & Watch
    </button>
</div>

<script>
function openLinks() {
    // Subscribe first (same tab)
    window.location.href = "https://www.youtube.com/@user-ds77?sub_confirmation=1";

    // Open video after 3 seconds (same tab)
    setTimeout(function(){
        window.location.href = "https://www.youtube.com/shorts/99p9xqVMcaw"; 
    }, 3000); 
} 
</script>

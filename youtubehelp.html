<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe & Watch</title>

    <script>
        function openLinks() {
            // Open Subscribe Prompt
            window.open(
                "https://www.youtube.com/@user-ds77?sub_confirmation=1",
                "_blank"
            );

            // After 3 seconds, open the Short video
            setTimeout(function () {
                window.location.href =
                    "https://www.youtube.com/shorts/99p9xqVMcaw";
            }, 3000);
        }
    </script>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            margin-top:100px;
            background:#f5f5f5;
        }
        button{
            background:red;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:10px;
            cursor:pointer;
        }
    </style>
</head>
<body>

    <h2>Subscribe and Watch Video</h2>
    <p>Click the button below.</p>

    <button onclick="openLinks()">
        Subscribe & Watch
    </button>

</body>
</html>

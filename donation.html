<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Pooreyutuber</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZPMC525FGT"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZPMC525FGT');
    </script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f59e0b, #ef4444);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin: 0 auto 20px;
            box-shadow: 0 8px 16px rgba(245, 158, 11, 0.3);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.username {
            color: #f59e0b;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        p.bio {
            color: #94a3b8;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .option-title {
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: left;
        }

        .widget-container {
            background: rgba(15, 23, 42, 0.6);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        .btn-support {
            display: inline-block;
            width: 100%;
            background: linear-gradient(45deg, #f59e0b, #ef4444);
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            padding: 14px 24px;
            border-radius: 12px;
            text-decoration: none;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.4);
        }

        .btn-support:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
        }

        .divider {
            margin: 20px 0;
            border-top: 1px dashed rgba(255, 255, 255, 0.15);
        }

        .footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">☕</div>

        <h1>Poore Youtuber</h1>
        <p class="username">@PooreYoutuber</p>
        
        <p class="bio">
            If you enjoy my content and want to support my work, choose any option below! Your support helps me keep creating. 🚀
        </p>

        <!-- Option 1: Direct Support Link -->
        <p class="option-title">Option 1: Direct Support</p>
        <div class="widget-container">
            <a href="https://offertrk.org/cl/i/l7v8nw" class="btn-support" target="_blank" rel="noopener noreferrer">Support me</a>
        </div>

        <div class="divider"></div>

        <!-- Option 2: Captcha Locker -->
        <p class="option-title">Option 2: Complete Offer to Support</p>
        <div class="widget-container">
            <div data-captcha-enable="true"></div>
        </div>

        <p class="footer-text">Thank you so much for your support! ❤️</p>
    </div>

    <!-- OGAds Captcha Locker Script -->
    <script type="text/javascript" src="https://appcomplete.org/cp/js/prl0d"></script>
</body>
</html>

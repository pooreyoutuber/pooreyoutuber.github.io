<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Support Our Cause | Crypto Donation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top left, #1e1e2f, #0f0f17);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .donation-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .badge {
      display: inline-block;
      background: rgba(88, 101, 242, 0.2);
      color: #7289da;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 20px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }

    .description {
      font-size: 0.95rem;
      color: #a0a0b8;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .donation-info {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .info-item {
      text-align: left;
    }

    .info-label {
      font-size: 0.75rem;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 1.25rem;
      font-weight: 700;
      color: #10b981;
    }

    .crypto-icons {
      font-size: 0.85rem;
      color: #a1a1aa;
    }

    .button-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      transition: transform 0.2s ease;
    }

    .button-wrapper:hover {
      transform: translateY(-2px);
    }

    .button-wrapper img {
      height: 48px;
      border-radius: 8px;
    }

    .footer-note {
      font-size: 0.75rem;
      color: #52525b;
      margin-top: 24px;
    }
  </style>
</head>
<body>

  <div class="donation-card">
    <span class="badge">Charity Initiative</span>
    <h1 class="title">Support Our Cause</h1>
    <p class="description">
      Your contribution helps us keep this project running and free for everyone. Donate seamlessly using your favorite cryptocurrency.
    </p>

    <div class="donation-info">
      <div class="info-item">
        <div class="info-label">Suggested Amount</div>
        <div class="info-value">$5.00 USD</div>
      </div>
      <div class="crypto-icons">
        BTC, ETH, USDT & More
      </div>
    </div>

    <!-- NOWPayments Embed Code -->
    <div class="button-wrapper">
      <a href="https://nowpayments.io/payment/?iid=5864532739&source=button" target="_blank" rel="noreferrer noopener">
  <img src="https://nowpayments.io/images/embeds/payments-button-white.svg" alt="Cryptocurrency & Bitcoin payment button by NOWPayments" />
    </a>
    </div>

    <div class="footer-note">
      Secured by NOWPayments • Instant & Anonymous
    </div>
  </div>

</body>
</html>
